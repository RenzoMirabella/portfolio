<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Guía de calles</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#f3c316;font-family:Archivo,sans-serif;color:#1b1b1b;display:grid;grid-template-columns:560px 1fr}
.tapa{padding:48px 56px;border-right:6px solid #1b1b1b;display:flex;flex-direction:column}
.marca{background:#d8281e;color:#fbfaf6;font-weight:900;font-stretch:70%;font-size:96px;line-height:.9;padding:18px 20px;text-transform:uppercase}
.sub{font-weight:800;font-size:26px;margin:20px 0 36px;text-transform:uppercase}
.indice div{display:grid;grid-template-columns:1fr 90px;border-bottom:2px solid #1b1b1b;padding:12px 0;font-weight:700;font-size:24px}
.indice div span:last-child{font-weight:900;text-align:right}
.plano{position:relative;background:#fbfaf6;background-image:linear-gradient(#1b1b1b 1.5px,transparent 1.5px),linear-gradient(90deg,#1b1b1b 1.5px,transparent 1.5px);background-size:110px 110px}
.plano svg{position:absolute;inset:0}
.col{position:absolute;top:0;left:0;right:0;display:flex;background:#1b1b1b;color:#f3c316;font-weight:900;font-size:22px}
.col span{width:110px;text-align:center;padding:4px 0}
</style></head><body>
<div class="tapa">
  <div class="marca">Renzo<br>Mirabella</div>
  <div class="sub">Guía de datos · Mar del Plata</div>
  <div class="indice">
    <div><span>Locales gastronómicos</span><span>7 · C4</span></div>
    <div><span>Comentarios Instagram</span><span>12 · F2</span></div>
    <div><span>Sobre mí</span><span>1 · A1</span></div>
  </div>
</div>
<div class="plano">
  <div class="col"><span>A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span><span>H</span></div>
  <svg viewBox="0 0 880 900"><path d="M600 0 C640 200 700 300 690 450 C680 600 740 750 760 900 L880 900 L880 0Z" fill="#9dd0e8"/>
  <g fill="#d8281e"><circle cx="560" cy="380" r="7"/><circle cx="590" cy="410" r="7"/><circle cx="540" cy="430" r="7"/><circle cx="610" cy="350" r="7"/><circle cx="500" cy="300" r="7"/><circle cx="620" cy="470" r="7"/><circle cx="430" cy="520" r="7"/><circle cx="580" cy="560" r="7"/></g>
  <path d="M100 900 L600 120 M0 400 L690 450 M200 0 L640 820" stroke="#f3c316" stroke-width="14" fill="none"/></svg>
</div>
</body></html>
